### 基础配置
model_name_or_path: qwen/Qwen2.5-VL-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
template: qwen2_5_vl

### 数据配置
dataset: bioreason_reasoning  # 如果有 BioCAP 数据，可以用逗号分隔
cutoff_len: 2048

### 训练参数 (基于 8xA100 配置)
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
bf16: true

### 输出配置
output_dir: saves/bioreason_sft
logging_steps: 10
save_steps: 500