### model
model_name_or_path: models/Qwen2.5-VL-7B-BioReason-SFT
stage: dpo
finetuning_type: lora
template: qwen2_vl

### dataset
dataset: bioreason_dpo_train
# 【核心修复1】放开长度限制，防止结尾的答案被截断！
cutoff_len: 4096

### training
do_train: true  # 【核心修复2】显式声明这是训练任务
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 1
logging_steps: 2  # 让你更快看到屏幕上的 loss 变化
save_steps: 100   # 跑一点就赶紧存下来，免得夜长梦多
output_dir: saves/bioreason/dpo/checkpoint-final
fp16: true