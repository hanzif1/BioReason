### 基础设置
# 必须使用未微调的官方底座
model_name_or_path: /data1/pretrained/bioclip/models/Qwen2.5-VL-7B
# 挂载我们刚刚只用 Source B 训出来的权重
adapter_name_or_path: saves/bioreason/sft_only_b/
stage: sft
do_predict: true
finetuning_type: lora
template: qwen2_vl

### 动态替换的参数
eval_dataset: test_PLT_VIL_Mini_labels
output_dir: saves/bioreason/predict_results_sft_only_b/test_PLT_VIL_Mini_labels

### 预测参数，直接上 32 拉满你的显卡
per_device_eval_batch_size: 32
predict_with_generate: true
max_new_tokens: 512
fp16: true
