### 基础设置
# 底座依然是你合并好的 SFT 模型
model_name_or_path: models/Qwen2.5-VL-7B-BioReason-SFT
# 挂载我们刚刚用 TRL 跑出来的 GRPO 终极权重！
adapter_name_or_path: saves/bioreason/grpo_trl/checkpoint-final
stage: sft
do_predict: true
finetuning_type: lora
template: qwen2_vl

### 动态替换的参数 (存入专属的 grpo 结果文件夹)
eval_dataset: test_nabird_metadata
output_dir: saves/bioreason/predict_results_grpo/test_nabird_metadata

### 预测参数
per_device_eval_batch_size: 32
predict_with_generate: true
max_new_tokens: 512
fp16: true
